[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lab-audit"
version = "0.1.0"
description = "Read-only AWS lab inventory and cleanup comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2"]

[project.scripts]
aws-lab-audit = "aws_lab_audit.cli:main"
